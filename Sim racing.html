<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sim Racing</title>
  <link rel="stylesheet" href="stylecarros1.css">
</head>
<body>
  <header>
    <h1>Sim Racing</h1>
    <p>Corridas virtuais todas as semanas</p>
  </header>
  <nav>
    <ul>
      <li><a href="#sobre">Sobre</a></li>
      <li><a href="#inscricao">Inscrição</a></li>
    </ul>
  </nav>
  <main>
    <section id="sobre">
      <h2>iRacing</h2>
      <img class="imagem"
           src="imagens/Imagemsolida.jpeg"
           alt="Carros IRacing">
      <p>Corra em casa com volante, pedais e um bom campeonato online,
         no estilo das corridas de endurance de Le Mans.</p>
      <a class="botao" href="https://www.iracing.com" target="_blank" rel="noopener">Visitar iRacing</a>
    </section>
    <section id="inscricao">
      <h2>Inscrição</h2>
      <form action="#" method="post">
        <label for="nome">Nome de piloto</label>
        <input type="text" id="nome" name="nome" required>
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>
        <button type="submit" class="botao">Inscrever-me</button>
      </form>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 Sim Racing</p>
  </footer>
</body>
</html>
